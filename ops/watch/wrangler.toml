# The account comes from CLOUDFLARE_ACCOUNT_ID at deploy time; secrets (TG_TOKEN, TG_CHAT) via `wrangler secret put`.
name = "laplace-watch"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = false
preview_urls = false

[triggers]
crons = ["20 * * * *", "0 8 * * 1"]

[observability]
enabled = true
