# Scheduled events that programs see as ctx.events: when they happen, never what they announce.
#
# Every date is copied from its publisher's calendar (all fetched 2026-10-25). Times are the publisher's US Eastern
# Time; `laplace_research.data.events` converts them with the IANA zone America/New_York, so daylight saving is exact.
# Nothing is known outside `covers`: extend this file before it ends (the live engine alerts 60 days ahead), and
# correct it when a publisher reschedules (a lapse in appropriations delayed and cancelled releases in late 2025).

covers = ["2025-01-01", "2027-12-31"]

[fomc]
# FOMC policy statements, released at 2:00 p.m. on a meeting's last day.
# https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm (2027 meetings are tentative until the preceding
# meeting confirms them). The notation vote of 2025-08-22 (longer-run goals, no policy decision) is not listed.
time = "14:00"
dates = [
  "2025-01-29", "2025-03-19", "2025-05-07", "2025-06-18", "2025-07-30", "2025-09-17", "2025-10-29", "2025-12-10",
  "2026-01-28", "2026-03-18", "2026-04-29", "2026-06-17", "2026-07-29", "2026-09-16", "2026-10-28", "2026-12-09",
  "2027-01-27", "2027-03-17", "2027-04-28", "2027-06-09", "2027-07-28", "2027-09-15", "2027-10-27", "2027-12-08",
]

