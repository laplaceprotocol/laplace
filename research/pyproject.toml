[project]
name = "laplace-research"
version = "0.1.0"
description = "Offline experiments for the Laplace forecasting swarm: cards, baselines, scoring."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "httpx>=0.27",
  "numpy>=2.1",
  "scipy>=1.14",
]

[project.optional-dependencies]
# Fitting EV-GBM (evolve.gbm). Frozen EV-GBM programs walk their trees with numpy and never need it.
gbm = ["lightgbm>=4.7"]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
laplace-research = "laplace_research.cli:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laplace_research"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["laplace_research"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "lightgbm", "lightgbm.*"]
ignore_missing_imports = true
