name: watch

on:
  push:
    branches: [main]
    paths: ["ops/watch/**", ".github/workflows/watch.yml"]
  pull_request:
    paths: ["ops/watch/**", ".github/workflows/watch.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: ops/watch

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test
