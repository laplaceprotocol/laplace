name: engine

on:
  push:
    branches: [main]
    paths: ["engine/**", "research/**", "contracts/test/vectors/**", ".github/workflows/engine.yml"]
  pull_request:
    paths: ["engine/**", "research/**", "contracts/test/vectors/**", ".github/workflows/engine.yml"]

permissions:
  contents: read

defaults:
  run:
    working-directory: engine

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff format --check
      - run: uv run ruff check
      - run: uv run mypy
      - run: uv run pytest
