[project]
name = "laplace-engine"
version = "0.1.0"
description = "The live engine: hourly forecasts, their Merkle commitments on-chain, and the public record."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "boto3>=1.35",
  "eth-abi>=5.1",
  "eth-account>=0.13",
  "eth-hash[pycryptodome]>=0.7",
  "httpx>=0.27",
  "laplace-research",
  "numpy>=2.1",
]

[project.optional-dependencies]
# Building releases with EV-GBM (`laplace-engine refit`). The hourly engine walks frozen trees with numpy alone.
fit = ["lightgbm>=4.7"]

[dependency-groups]
dev = [
  "mypy>=1.11",
  "pytest>=8.3",
  "ruff>=0.6",
]

[project.scripts]
laplace-engine = "laplace_engine.cli:main"

[tool.uv.sources]
laplace-research = { path = "../research", editable = true }

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/laplace_engine"]

[tool.ruff]
line-length = 120
target-version = "py312"
# A release's programs are identified by the hash of their exact bytes; never reformat them.
extend-exclude = ["releases"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.ruff.lint.isort]
known-first-party = ["laplace_engine", "laplace_research"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
packages = ["laplace_engine"]

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "boto3", "boto3.*", "botocore", "botocore.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
